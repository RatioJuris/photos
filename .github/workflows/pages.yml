# SPDX-License-Identifier: GPL-3.0-or-later
# Publishes the website in .docs/ (plus the README screenshots) to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - ".docs/**"
      - "screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R .docs/. _site/
          cp -R screenshots _site/screenshots
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
